[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytutor"
version = "0.1.0"
description = "An interactive Python tutor grounded in the official Python documentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "textual>=1.0.0",
    "rich>=13.9.0",
    "llama-index>=0.14.7",
    "ollama>=0.4.0",
    "llama-index-vector-stores-faiss>=0.5.0",
    "faiss-cpu>=1.8.0",
]

[project.scripts]
pytutor = "pytutor.cli:main"

[tool.setuptools]
packages = ["pytutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
